version: 2
project_name: google-analytics-solo-pp-cli
changelog:
  disable: true
builds:
  - id: google-analytics-solo-pp-cli
    main: ./cmd/google-analytics-solo-pp-cli
    binary: google-analytics-solo-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X google-analytics-solo-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: google-analytics-solo-pp-mcp
    main: ./cmd/google-analytics-solo-pp-mcp
    binary: google-analytics-solo-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: google-analytics-solo-pp-cli
    repository:
      owner: pooriaarab
      name: homebrew-tap
    homepage: "https://github.com/pooriaarab/google-analytics-solo-pp-cli"
    description: "Flag-driven GA4 reports, one-command fan-out across every property, and a local cache for offline trends — none of which the raw Data API gives you."
    install: |
      bin.install "google-analytics-solo-pp-cli"
      bin.install "google-analytics-solo-pp-mcp"
